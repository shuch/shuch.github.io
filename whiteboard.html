<!DOCTYPE html>
<html>
<head>
<title>Whiteboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body contenteditable spellcheck="false" tabindex="0" style="font-family:-apple-system,sans-serif;font-size:20px;line-height:1.6;padding:40px;margin:0;min-height:100vh;outline:none;box-sizing:border-box;">
<script>
  var body = document.body;
  var focused = false;

  function tryFocus() {
    if (focused) return;
    focused = true;
    body.focus();
  }

  // 桌面浏览器：页面刚加载完，尝试一次自动聚焦（很多桌面浏览器允许）
  window.addEventListener('load', function () {
    // 延迟到下一帧，避免和渲染冲突，只调用一次
    requestAnimationFrame(tryFocus);
  });

  // 兜底：任何一次点击/触摸都会强制聚焦（移动端靠这个生效）
  ['pointerdown', 'touchstart', 'click'].forEach(function (evt) {
    document.addEventListener(evt, function () {
      body.focus();
    }, { passive: true });
  });
</script>
</body>
</html>
