<!DOCTYPE html>
<html>
<head>
<title>Whiteboard</title>
</head>
<body contenteditable spellcheck="false" tabindex="0" style="font-family:-apple-system,sans-serif;font-size:20px;line-height:1.6;padding:40px;margin:0;min-height:100vh;outline:none;">
<script>
  function focusBoard() {
    document.body.focus();
    // 把光标移动到内容末尾，避免聚焦后光标位置怪异
    var range = document.createRange();
    range.selectNodeContents(document.body);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 多个时机尝试聚焦，覆盖不同浏览器/加载时序的情况
  window.addEventListener('DOMContentLoaded', focusBoard);
  window.addEventListener('load', focusBoard);
  window.addEventListener('pageshow', focusBoard); // 处理 bfcache 回退场景
  setTimeout(focusBoard, 50); // 兜底：有些浏览器需要延迟一帧才生效
</script>
</body>
</html>
